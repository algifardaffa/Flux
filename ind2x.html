<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Damage - Chaos Belt & SS Gloves V4</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js untuk Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Input Panel -->
      <div class="lg:col-span-1 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-5">
        <h2 class="text-lg font-semibold text-white border-b border-slate-700 pb-3 flex items-center gap-2">
          <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
          Flux Damage Calculator
        </h2>
      
<!-- Panel Input -->
      <div class="space-y-4">
        
        <!-- Container Grid 2x2 untuk Input -->
        <div class="grid grid-cols-2 gap-4">

          <!-- Toggle SS Gloves (Dibuat Span 2 Kolom di Atas Grid) -->
          <div class="col-span-2 bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium text-slate-200">SS Gloves V4 Yet?</span>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="ssGlovesToggle" class="sr-only peer" onchange="updateGloveBadge()">
                <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
              </label>
            </div>
            <div class="flex justify-between items-center text-xs">
            </div>
          </div>

          <!-- Baris 1 - Kolom 1: Min Flux -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Min Flux Belt (%)</label>
            <input type="number" id="minBelt" value="80" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
          </div>

          <!-- Baris 1 - Kolom 2: Max Flux -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Max Flux Belt (%)</label>
            <input type="number" id="maxBelt" value="290" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
          </div>

          <!-- Baris 2 - Kolom 1: Resonance Chance -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Reso Chance (%)</label>
            <input type="number" step="0.1" id="resoc" value="55" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
          </div>

          <!-- Baris 2 - Kolom 2: Resonance Damage -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Reso Damage (%)</label>
            <input type="number" step="0.1" id="resod" value="80.5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
          </div>

          <!-- Run Button (Span 2 Kolom di Bawah Grid) -->
          <button onclick="runSimulation()" class="col-span-2 w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Run Simulation
          </button>

        </div>
      </div>

        <!-- Number of Simulations -->


      <!-- Results & Chart Panel -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md">
            <span class="text-slate-400 text-xs font-medium block">Minimum Boost</span>
            <span id="statMin" class="text-xl font-bold text-rose-400 mt-1 block">0.00%</span>
          </div>
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md">
            <span class="text-slate-400 text-xs font-medium block">Maximum Boost</span>
            <span id="statMax" class="text-xl font-bold text-emerald-400 mt-1 block">0.00%</span>
          </div>
          
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md">
            <span class="text-slate-400 text-xs font-medium block">Average Boost</span>
            <span id="statAvg" class="text-xl font-bold text-indigo-400 mt-1 block">0.00%</span>
          </div>

        </div>

        <!-- Chart Container -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
          <div class="flex items-center justify-center mb-4">
            <h3 class="text-base font-semibold text-white">Damage Variation Across 100 LME (%)</h3>

          </div>
          <div class="relative h-[360px] w-full">
            <canvas id="damageChart"></canvas>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Message Box Toast Notification -->
  <div id="toast" class="hidden fixed bottom-5 right-5 bg-rose-600 text-white px-5 py-3 rounded-xl shadow-2xl transition-all border border-rose-500 text-sm font-medium">
    <span id="toastMsg">Pesan Peringatan</span>
  </div>

  <script>
    let chartInstance = null;

    function showToast(message) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.innerText = message;
      toast.classList.remove("hidden");
      setTimeout(() => {
        toast.classList.add("hidden");
      }, 3500);
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // --- KODE BARU (Aman dari Error) ---
    function updateGloveBadge() {
      const toggleEl = document.getElementById("ssGlovesToggle");
      const statusText = document.getElementById("toggleStatusText");
      const gloveBadge = document.getElementById("gloveValueBadge");
    
      if (!toggleEl) return;
      const isV4 = toggleEl.checked;
    
      if (statusText) {
        statusText.innerText = isV4 ? "True (V4 Activated)" : "False (V3/Lainnya)";
        statusText.className = isV4 ? "text-emerald-400 font-semibold" : "text-rose-400 font-semibold";
      }
    
      if (gloveBadge) {
        gloveBadge.innerText = isV4 ? "Glove = 2.3" : "Glove = 2.0";
      }
    }

    function runSimulation() {
      const min = parseFloat(document.getElementById("minBelt").value);
      const max = parseFloat(document.getElementById("maxBelt").value);
      const resoc = parseFloat(document.getElementById("resoc").value);
      const resod = parseFloat(document.getElementById("resod").value);
      const simCountInput = document.getElementById("simCount");
      const n = simCountInput ? (parseInt(simCountInput.value) || 100) : 100;
      const button = document.getElementById("ssGlovesToggle").checked;

      if (isNaN(min) || isNaN(max) || isNaN(resoc) || isNaN(resod)) {
        showToast("Harap masukkan semua parameter angka dengan benar.");
        return;
      }

      if (min > max) {
        showToast("Min flux belt harus lebih kecil atau sama dengan Max flux belt.");
        return;
      }

      const glove = button ? 2.3 : 2.0;
      const gloves = 0.5 + glove / 2;
      const resox = (resoc * resod * 4) / 50000 + 1;
      const mid = ((min + max) * gloves * resox) / 2;

      const Ave = [];

      for (let j = 0; j < n; j++) {
        let sum = 0;
        let buff_until = 0;

        for (let i = 0; i < 180; i++) {
          let damage = getRandomInt(min, max);

          if (i % 5 === 0) {
            if (Math.random() < resoc / 100) {
              buff_until = i + 4;
            }
          }

          if (i < buff_until) {
            damage *= 1 + resod / 100;
          }

          if (i % 20 < 10) {
            damage *= glove;
          }

          sum += damage;
        }

        const boostPct = (100 * sum) / (180 * mid) - 100;
        Ave.push(boostPct);
      }

      const avgValue = Ave.reduce((a, b) => a + b, 0) / Ave.length;
      const minValue = Math.min(...Ave);
      const maxValue = Math.max(...Ave);

      document.getElementById("statAvg").innerText = `${avgValue >= 0 ? '+' : ''}${avgValue.toFixed(2)}%`;
      document.getElementById("statMin").innerText = `${minValue >= 0 ? '+' : ''}${minValue.toFixed(2)}%`;
      document.getElementById("statMax").innerText = `${maxValue >= 0 ? '+' : ''}${maxValue.toFixed(2)}%`;
      
      const statMidEl = document.getElementById("statMid");
      if (statMidEl) statMidEl.innerText = mid.toFixed(1);

      const labels = Array.from({ length: n }, (_, i) => i + 1);

      if (chartInstance) {
        chartInstance.destroy();
      }

      const ctx = document.getElementById("damageChart").getContext("2d");

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Damage of an LME (%)",
              data: Ave,
              borderColor: "#6366f1",
              backgroundColor: "rgba(99, 102, 241, 0.1)",
              borderWidth: 2,
              pointRadius: n > 150 ? 1 : 2.5,
              pointHoverRadius: 5,
              fill: true,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: "#94a3b8",
                font: { family: "Inter" }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return ` Boost: ${context.parsed.y.toFixed(2)}%`;
                }
              }
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: "Number of LME Attempt",
                color: "#94a3b8",
                font: { weight: "500", family: "Inter" }
              },
              grid: { color: "rgba(51, 65, 85, 0.4)" },
              ticks: { color: "#64748b" }
            },
            y: {
              title: {
                display: true,
                text: "Difference From Average Damage (%)",
                color: "#94a3b8",
                font: { weight: "500", family: "Inter" }
              },
              grid: { color: "rgba(51, 65, 85, 0.4)" },
              ticks: {
                color: "#64748b",
                callback: function(value) {
                  return value + "%";
                }
              }
            }
          }
        }
      });
    }

    window.onload = function() {
      updateGloveBadge();
      runSimulation();
    };
  </script>
</body>
</html>
